<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <title>Page not found — SUN / Kuafu</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #17283a;
      background: #f6f8fb;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main {
      width: min(680px, calc(100vw - 36px));
      padding: 56px;
      background: #fff;
      border: 1px solid #cbd5df;
      border-radius: 14px;
      box-shadow: 0 14px 38px rgba(31, 56, 82, .08);
      text-align: center;
    }
    span {
      color: #245d8d;
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 {
      margin: 17px 0 14px;
      color: #102033;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 8vw, 4.7rem);
      line-height: 1.02;
      letter-spacing: -.035em;
    }
    p {
      max-width: 480px;
      margin: 0 auto 28px;
      color: #5f6d7c;
      line-height: 1.65;
    }
    a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0 17px;
      color: #fff;
      background: #184b77;
      border-radius: 7px;
      font-weight: 750;
      text-decoration: none;
    }
    a:hover { background: #245d8d; }
  </style>
</head>
<body>
  <main>
    <span>Error 404</span>
    <h1>Page not found.</h1>
    <p>The requested address is not part of the SUN / Kuafu project page.</p>
    <a href="/">Return to the project page</a>
  </main>
</body>
</html>
